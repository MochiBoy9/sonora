<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Sonora — a fast music player for the files already on your computer.">
<title>Sonora</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c6cff'/><g fill='%23fff'><rect x='9' y='13' width='3' height='6' rx='1.5'/><rect x='14.5' y='9' width='3' height='14' rx='1.5'/><rect x='20' y='12' width='3' height='8' rx='1.5'/></g></svg>">

<link rel="preload" href="css/base.css" as="style">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">

<script>
  // Applied before first paint so the app never flashes the wrong theme.
  try {
    var t = localStorage.getItem('sonora:theme');
    if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
    var w = parseInt(localStorage.getItem('sonora:sidebar') || '0', 10);
    if (w) document.documentElement.style.setProperty('--sidebar-w', Math.min(380, Math.max(190, w)) + 'px');
  } catch (e) {}
</script>
</head>

<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <aside class="pane" id="pane" aria-label="Now playing and queue"></aside>

  <footer class="playerbar" id="playerbar"></footer>
</div>

<div class="boot" id="boot">
  <div class="boot-mark">
    <svg viewBox="0 0 24 24" class="ico"><use href="#i-logo"/></svg>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
