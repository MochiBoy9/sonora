<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sonora">
  <!-- The mark is the app's own logo: four bars of a spectrum, at the heights
       the sidebar draws them. Drawn on the full square rather than inset,
       because a maskable icon is cropped to whatever shape the platform
       prefers and anything near the edge is what gets taken. -->
  <rect width="512" height="512" fill="#04080e"/>
  <g fill="#00d1ff">
    <rect x="140" y="224" width="42" height="96" rx="2"/>
    <rect x="212" y="160" width="42" height="224" rx="2"/>
    <rect x="284" y="112" width="42" height="320" rx="2"/>
    <rect x="356" y="200" width="42" height="144" rx="2"/>
  </g>
</svg>
