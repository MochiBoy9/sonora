<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Sonora — a fast music player for the files already on your computer.">
<meta name="theme-color" content="#04080e">
<title>Sonora</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2304080e'/><g fill='%2300d1ff'><rect x='7' y='14' width='3' height='6'/><rect x='12' y='9' width='3' height='16'/><rect x='17' y='6' width='3' height='22'/><rect x='22' y='12' width='3' height='10'/></g></svg>">

<link rel="preload" href="css/base.css" as="style">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/visualizer.css">

<script>
  // Applied before first paint so the app never flashes the wrong theme.
  try {
    var t = localStorage.getItem('sonora:theme');
    if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
    var w = parseInt(localStorage.getItem('sonora:sidebar') || '0', 10);
    if (w) document.documentElement.style.setProperty('--sidebar-w', Math.min(380, Math.max(190, w)) + 'px');
  } catch (e) {}
</script>
</head>

<body>

<!-- One sprite, drawn with a single pen: 1.5px strokes, square caps, mitre
     joins, everything on a 24-unit grid. Filled glyphs (the transport) say so
     explicitly so the stroke rules do not apply to them. -->

    <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><rect x="8.4" y="5.4" width="2.2" height="2.2"/><rect x="13.4" y="5.4" width="2.2" height="2.2"/><rect x="8.4" y="10.9" width="2.2" height="2.2"/><rect x="13.4" y="10.9" width="2.2" height="2.2"/><rect x="8.4" y="16.4" width="2.2" height="2.2"/><rect x="13.4" y="16.4" width="2.2" height="2.2"/></g></symbol>

    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M3.6 3.6h16.8v16.8H3.6z"/><path d="M3.6 14.4h6.8v6h-6.8zM10.4 8.4h5v12h-5z"/></symbol>

    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2.5 12h2.6l2-7 3.2 16 3-13 2.2 7.4 1.6-3.4h4.4"/></symbol>

    <symbol id="i-database" viewBox="0 0 24 24"><path d="M4.5 4.5h15v5h-15zM4.5 9.5h15v5h-15zM4.5 14.5h15v5h-15z"/><path d="M7 7h1.4M7 12h1.4M7 17h1.4"/></symbol>
    <symbol id="i-circles" viewBox="0 0 24 24"><circle cx="9" cy="9" r="5.2"/><circle cx="16.4" cy="14.6" r="3.4"/><circle cx="7.4" cy="17.6" r="2.2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 3.6 5.4 3.6 8.5s-1.2 5.9-3.6 8.5c-2.4-2.6-3.6-5.4-3.6-8.5S9.6 6.1 12 3.5"/></symbol>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <aside class="pane" id="pane" aria-label="Now playing and queue"></aside>

  <footer class="playerbar" id="playerbar"></footer>
</div>

<!-- The intro has to exist in the HTML, not be built by a module: it is what
     covers the gap between first paint and the app being ready to look at.
     js/intro.js takes over the canvas with a 3D scene and animates the rest;
     the SVG mark below is what plays if there is no WebGL, and the CSS
     failsafe removes the whole thing if the scripts never arrive. -->
<div class="intro" id="intro" role="status" aria-label="Sonora is starting">
  <canvas class="intro-scene" aria-hidden="true"></canvas>

  <svg class="intro-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 6 V0 H8" /><path d="M92 0 H100 V6" />
    <path d="M100 94 V100 H92" /><path d="M8 100 H0 V94" />
  </svg>

  <div class="intro-stage">
    <svg class="intro-logo" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <g class="intro-bars">
        <rect x="39" y="58" width="6" height="20"/>
        <rect x="51" y="38" width="6" height="40"/>
        <rect x="63" y="26" width="6" height="52"/>
        <rect x="75" y="50" width="6" height="28"/>
      </g>
    </svg>

    <p class="intro-eyebrow">Welcome</p>
    <h1 class="intro-word" aria-label="Sonora"><span>S</span><span>O</span><span>N</span><span>O</span><span>R</span><span>A</span></h1>
    <p class="intro-tag">Your music, played from your own disk.</p>
    <div class="intro-meter"><i></i></div>
    <p class="intro-hint">Press any key to skip</p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
